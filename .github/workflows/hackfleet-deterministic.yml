name: HackFleet deterministic worker
run-name: hf-deterministic/${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Controller-reserved dispatch UUID
        required: true
        type: string
      request:
        description: Versioned deterministic request JSON (never credentials)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hf-deterministic-${{ inputs.dispatch_id }}
  cancel-in-progress: false
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Checkout trusted worker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Checkout exact target commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ fromJSON(inputs.request).sourceSha }}
          path: target
          persist-credentials: false
      - name: Execute bounded deterministic task
        run: node controller/.hackfleet/actions/worker.mjs
      - name: Save structured result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hf-result-${{ inputs.dispatch_id }}
          path: ${{ runner.temp }}/hackfleet-result/receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
